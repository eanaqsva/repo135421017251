<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF Lerntrainer</title><style>
:root{--bg:#f4f6f8;--s:#fff;--s2:#eef2f7;--t:#172033;--m:#6b7280;--l:#dfe4ea;--p:#2563eb;--ps:#e8f0ff;--g:#16a34a;--gs:#e9f8ee;--r:#dc2626;--rs:#fdecec;--safe:env(safe-area-inset-bottom,0px)}[data-theme=dark]{--bg:#111827;--s:#1f2937;--s2:#273449;--t:#f3f4f6;--m:#a7b0bf;--l:#374151;--p:#60a5fa;--ps:#1e3a5f;--g:#4ade80;--gs:#173b2a;--r:#fb7185;--rs:#4a2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}.app{min-height:100dvh}.head{position:sticky;top:0;z-index:5;background:var(--s);border-bottom:1px solid var(--l);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}.hr,.back{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.icon{width:42px;height:42px;border:1px solid var(--l);border-radius:13px;background:var(--s)}main{max-width:760px;margin:auto;padding:18px 14px 40px}.view{display:none}.view.on{display:block}.hero,.metric,.menu button,.option,.feedback{background:var(--s);border:1px solid var(--l)}.hero{border-radius:22px;padding:20px}.hero h1{font-size:1.7rem;margin:6px 0}.hero p,.hint,.counter,.why{color:var(--m)}.ey{font-size:.8rem;color:var(--p);font-weight:800}.prog{height:10px;background:var(--s2);border-radius:99px;margin:18px 0 8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--p)}.pt{display:flex;justify-content:space-between;color:var(--m);font-size:.9rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{padding:13px 5px;border-radius:16px;text-align:center}.metric b{display:block;font-size:1.3rem}.metric span{font-size:.78rem;color:var(--m)}.menu{display:grid;gap:9px}.menu button,.primary{min-height:54px;border-radius:15px;padding:0 15px;text-align:left}.primary{border:0!important;background:var(--p)!important;color:white;text-align:center!important;font-weight:800}.back{margin-bottom:10px}.back button{border:0;background:none;color:var(--p);padding:8px 0}.legend{display:flex;gap:12px;color:var(--m);font-size:.8rem;margin-bottom:14px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.tile{aspect-ratio:1;border:1px solid var(--l);border-radius:13px;background:var(--s);font-weight:800}.tile.ok{background:var(--gs);border-color:var(--g);color:var(--g)}.tile.no{background:var(--rs);border-color:var(--r);color:var(--r)}h2{font-size:clamp(1.2rem,5vw,1.65rem);line-height:1.4}.options{display:grid;gap:10px}.option{min-height:62px;width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;border-radius:16px;padding:13px;transition:.18s}.option:active{transform:scale(.985)}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:var(--s2);color:var(--p);font-weight:800}.answer{padding-top:5px}.option.good{background:var(--gs);border-color:var(--g);color:var(--g);animation:pop .35s ease}.option.bad{background:var(--rs);border-color:var(--r);color:var(--r);animation:shake .42s ease}.option.reveal{border-color:var(--g);background:var(--gs)}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}@keyframes pop{50%{transform:scale(1.025)}}.feedback{display:none;margin-top:13px;padding:14px;border-radius:15px}.feedback.show{display:block}.status{position:fixed;z-index:20;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);opacity:0;border-radius:99px;padding:9px 16px;color:white;font-weight:800;transition:.2s;pointer-events:none}.status.show{opacity:1;transform:translate(-50%,0)}.status.ok{background:var(--g)}.status.no{background:var(--r)}.next{width:100%;margin-top:12px}.switch{display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--s);border:1px solid var(--l);border-radius:15px;padding:13px 15px}.switch input{width:22px;height:22px}@media(max-width:420px){.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="app"><header class="head"><div class="hr"><div class="brand">VCF Lerntrainer</div><button class="icon" id="theme">◐</button></div></header><main><section class="view on" id="home"><div class="hero"><div class="ey">DEIN LERNFORTSCHRITT</div><h1>Bereit für die nächste Runde?</h1><p id="copy"></p><div class="prog"><i id="bar"></i></div><div class="pt"><span id="done"></span><b id="pct"></b></div></div><div class="metrics"><div class="metric"><b id="learned">0</b><span>gelernt</span></div><div class="metric"><b id="open">60</b><span>offen</span></div><div class="metric"><b id="rate">0%</b><span>richtig</span></div></div><div class="menu"><button class="primary" id="cont">Weiterlernen</button><button id="all">Alle Fragen ansehen</button><button id="wrong">Falsche Fragen wiederholen</button><label class="switch"><span>Erklärung nach Antwort anzeigen</span><input type="checkbox" id="explain"></label></div></section><section class="view" id="overview"><div class="back"><button data-home>‹ Startmenü</button><span class="counter">Alle 60 Fragen</span></div><h1>Fragenübersicht</h1><div class="legend"><span><i class="dot" style="background:var(--s);border:1px solid var(--l)"></i> Offen</span><span><i class="dot" style="background:var(--g)"></i> Richtig</span><span><i class="dot" style="background:var(--r)"></i> Falsch</span></div><div class="grid" id="grid"></div></section><section class="view" id="quiz"><div class="back"><button data-home>‹ Startmenü</button><span class="counter" id="counter"></span></div><h2 id="question"></h2><p class="hint" id="hint"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="primary next" id="next" style="display:none">Nächste Frage</button></section></main></div><div class="status" id="status"></div><script src="questions.js"></script><script>
const Q=window.VCF_QUESTIONS,K='vcf-touch-v4';let S=JSON.parse(localStorage.getItem(K)||'null')||{pos:0,order:Q.map((_,i)=>i),results:{},theme:'light',explain:false},locked=false;const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(S))}function cur(){return Q[S.order[S.pos%S.order.length]]}function theme(){document.documentElement.dataset.theme=S.theme==='dark'?'dark':'';save()}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));if(id==='home')home();if(id==='overview')overview();if(id==='quiz')quiz();scrollTo({top:0,behavior:'smooth'})}function sum(){let v=Object.values(S.results),c=v.filter(x=>x==='correct').length;return{n:v.length,c,open:60-v.length,rate:v.length?Math.round(c/v.length*100):0}}function home(){let x=sum(),p=Math.round(x.n/60*100);$('#copy').textContent=x.n?`Du hast ${x.n} von 60 Fragen bearbeitet.`:'Starte mit der ersten Frage oder öffne die Übersicht.';$('#done').textContent=`${x.n} von 60 bearbeitet`;$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';$('#learned').textContent=x.n;$('#open').textContent=x.open;$('#rate').textContent=x.rate+'%';$('#explain').checked=S.explain}function overview(){$('#grid').innerHTML=Q.map((q,i)=>`<button class="tile ${S.results[q.id]==='correct'?'ok':S.results[q.id]==='wrong'?'no':''}" data-i="${i}">${q.id}</button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{S.order=Q.map((_,i)=>i);S.pos=+b.dataset.i;save();show('quiz')})}function quiz(){locked=false;let q=cur();$('#counter').textContent=`Frage ${q.id} von 60`;$('#question').textContent=q.question;$('#hint').textContent=q.answers.length>1?`${q.answers.length} richtige Antworten: Tippe alle richtigen nacheinander an`:'Tippe eine Antwort an';$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option" data-k="${k}"><span class="letter">${k}</span><span class="answer">${esc(v)}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>tap(b.dataset.k));$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#next').style.display='none'}let multiPicked=new Set();function tap(k){if(locked)return;let q=cur(),multi=q.answers.length>1,b=[...document.querySelectorAll('.option')].find(x=>x.dataset.k===k);if(multi){if(q.answers.includes(k)){b.classList.add('good');multiPicked.add(k);if(multiPicked.size<q.answers.length){flash('Richtig, noch eine','ok');return}finish(true,k)}else{b.classList.add('bad');finish(false,k)}}else finish(q.answers.includes(k),k)}function finish(ok,k){locked=true;let q=cur();S.results[q.id]=ok?'correct':'wrong';save();document.querySelectorAll('.option').forEach(b=>{if(b.dataset.k===k)b.classList.add(ok?'good':'bad');if(!ok&&q.answers.includes(b.dataset.k))b.classList.add('reveal');b.disabled=true});flash(ok?'Richtig!':'Falsch',''+(ok?'ok':'no'));if(S.explain){let f=$('#feedback');f.className='feedback show';f.innerHTML=`<b>Richtige Antwort${q.answers.length>1?'en':''}: ${q.answers.join(', ')}</b><div class="why">${esc(q.explanation)}</div>`;$('#next').style.display='block'}else setTimeout(next,ok?850:1200)}function flash(t,c){let s=$('#status');s.textContent=t;s.className='status show '+c;setTimeout(()=>s.className='status',700);if(navigator.vibrate)navigator.vibrate(c==='ok'?40:[45,35,45])}function next(){multiPicked.clear();S.pos=(S.pos+1)%S.order.length;save();quiz();scrollTo({top:0,behavior:'smooth'})}$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';theme()};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));$('#all').onclick=()=>show('overview');$('#cont').onclick=()=>{S.order=Q.map((_,i)=>i);let i=Q.findIndex(q=>!S.results[q.id]);S.pos=i<0?0:i;save();show('quiz')};$('#wrong').onclick=()=>{let x=Q.filter(q=>S.results[q.id]==='wrong');if(!x.length)return alert('Noch keine falschen Fragen');S.order=x.map(q=>Q.findIndex(y=>y.id===q.id));S.pos=0;save();show('quiz')};$('#explain').onchange=e=>{S.explain=e.target.checked;save()};$('#next').onclick=next;theme();show('home');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
