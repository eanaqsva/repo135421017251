<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VCF Trainer"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF 9.0 Lerntrainer</title><style>
:root{--bg:#07111f;--panel:#10243a;--text:#eef7ff;--muted:#9fb2c8;--accent:#5eead4;--blue:#60a5fa;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--line:#ffffff1c;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 10% 0,#17344f,transparent 35%),var(--bg)}button,input{font:inherit}.app{min-height:100dvh;padding-bottom:calc(88px + var(--safe))}.top{position:sticky;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top,0px)) 15px 10px;background:#07111fe8;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:850}.counter{color:var(--accent);font-size:.86rem}.bar{height:5px;margin-top:10px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0}.screen{max-width:720px;margin:auto;padding:16px 14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{border:1px solid var(--line);background:#ffffff0c;color:var(--muted);min-height:42px;border-radius:13px}.tab.active{color:var(--text);border-color:var(--accent);background:#5eead418}.stats{display:flex;gap:8px;overflow:auto;margin:13px 0}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted);font-size:.82rem}.chip b{color:var(--text)}h1{font-size:clamp(1.22rem,5vw,1.65rem);line-height:1.42;margin:16px 2px}.hint{font-size:.9rem;color:var(--muted);margin:0 2px 11px}.options{display:grid;gap:10px}.option{width:100%;min-height:60px;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#ffffff0b;color:var(--text);border-radius:17px;padding:13px}.option.sel{border-color:var(--blue);background:#60a5fa20}.option.good{border-color:var(--ok);background:#34d39920}.option.bad{border-color:var(--bad);background:#fb718520}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:#06101d;color:var(--accent);font-weight:850}.answer{padding-top:5px}.feedback{display:none;margin-top:15px;padding:15px;border:1px solid var(--line);border-radius:17px;line-height:1.48}.feedback.show{display:block}.feedback.ok{border-color:var(--ok);background:#34d39915}.feedback.no{border-color:var(--bad);background:#fb718515}.why{margin-top:9px;color:#d6e8f8;font-size:.94rem}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:10px 12px calc(10px + var(--safe));display:grid;grid-template-columns:50px 1fr 54px;gap:9px;background:#07111ff0;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.action{min-height:52px;border:1px solid var(--line);border-radius:15px;background:#ffffff0c;color:var(--text)}.primary{border:0;background:linear-gradient(135deg,#14b8a6,#2563eb);font-weight:850}.marked{color:var(--warn)}.panel{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(78px + var(--safe));max-width:560px;margin:auto;display:none;gap:8px;background:#10243afa;border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 22px 70px #0009}.panel.show{display:grid}.panel button{min-height:48px;border:1px solid var(--line);border-radius:13px;background:#ffffff0b;color:var(--text)}.flash{display:none;min-height:320px;perspective:1000px}.flash.show{display:block}.flashcard{position:relative;width:100%;min-height:320px;transform-style:preserve-3d;transition:.5s}.flashcard.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#16344f,#0c1d30);padding:22px;display:grid;place-items:center;text-align:center}.back{transform:rotateY(180deg)}.back .correctText{color:var(--accent);font-size:1.35rem;font-weight:800}.examSetup{display:none;border:1px solid var(--line);border-radius:18px;padding:16px;background:#ffffff08}.examSetup.show{display:block}.examSetup label{display:block;color:var(--muted);margin:10px 0 5px}.examSetup input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#06101d;color:var(--text)}.examSetup button{width:100%;margin-top:14px}.timer{color:var(--warn);font-weight:850}.toast{position:fixed;z-index:50;left:50%;bottom:calc(94px + var(--safe));transform:translate(-50%,10px);opacity:0;background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="app"><header class="top"><div class="row"><div class="brand">VCF 9.0 Trainer</div><div><span class="timer" id="timer"></span> <span class="counter" id="counter"></span></div></div><div class="bar"><i id="bar"></i></div></header><main class="screen"><div class="tabs"><button class="tab active" data-mode="learn">Lernen</button><button class="tab" data-mode="cards">Karten</button><button class="tab" data-mode="exam">Prüfung</button></div><div class="stats"><div class="chip">Richtig <b id="right">0</b></div><div class="chip">Falsch <b id="wrong">0</b></div><div class="chip">Fällig <b id="due">0</b></div><div class="chip">Quote <b id="rate">0%</b></div></div><section id="quiz"><h1 id="question"></h1><p class="hint" id="hint"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div></section><section class="flash" id="flash"><div class="flashcard" id="flashcard"><div class="face front"><h1 id="cardQ"></h1></div><div class="face back"><div><div class="correctText" id="cardA"></div><div class="why" id="cardWhy"></div></div></div></div></section><section class="examSetup" id="examSetup"><h2>Prüfungsmodus</h2><label for="examCount">Fragen</label><input id="examCount" type="number" min="1" max="60" value="60"><label for="examMinutes">Zeitlimit in Minuten</label><input id="examMinutes" type="number" min="1" max="240" value="90"><button class="action primary" id="startExam">Prüfung starten</button></section></main></div><nav class="bottom"><button class="action" id="mark">☆</button><button class="action primary" id="main">Antwort prüfen</button><button class="action" id="more">•••</button></nav><div class="panel" id="panel"><button id="wrongOnly">Fällige/falsche Fragen üben</button><button id="random">Zufallsreihenfolge</button><button id="reveal">Lösung anzeigen</button><button id="reset">Fortschritt zurücksetzen</button></div><div class="toast" id="toast"></div><script src="questions.js"></script><script>
const Q=window.VCF_QUESTIONS,KEY='vcf-pwa-v1';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{pos:0,order:Q.map((_,i)=>i),done:{},r:0,w:0,b:[],sr:{},mode:'learn',exam:null},sel=new Set(),locked=false,tick=null;const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(S))}function cur(){return Q[S.order[S.pos%S.order.length]]}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function dueIds(){let now=Date.now();return Q.filter(q=>!S.sr[q.id]||S.sr[q.id].due<=now||S.sr[q.id].level===0).map(q=>q.id)}function review(q,ok){let x=S.sr[q.id]||{level:0,due:0};x.level=ok?Math.min(5,x.level+1):0;let days=[0,1,3,7,14,30][x.level];x.due=Date.now()+days*86400000;S.sr[q.id]=x}function stats(){let t=S.r+S.w;$('#right').textContent=S.r;$('#wrong').textContent=S.w;$('#rate').textContent=(t?Math.round(S.r/t*100):0)+'%';$('#due').textContent=dueIds().length;$('#bar').style.width=Object.keys(S.done).length/Q.length*100+'%'}function render(){clearInterval(tick);sel.clear();locked=false;let q=cur();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===S.mode));$('#quiz').style.display=S.mode==='cards'||S.mode==='examSetup'?'none':'block';$('#flash').classList.toggle('show',S.mode==='cards');$('#examSetup').classList.toggle('show',S.mode==='examSetup');$('#timer').textContent='';$('#counter').textContent=S.mode==='examSetup'?'':`Frage ${S.pos+1} / ${S.order.length}`;$('#panel').classList.remove('show');$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#mark').textContent=S.b.includes(q.id)?'★':'☆';$('#mark').classList.toggle('marked',S.b.includes(q.id));if(S.mode==='cards'){$('#cardQ').textContent=q.question;$('#cardA').textContent='Antwort: '+q.answers.join(', ');$('#cardWhy').textContent=q.explanation;$('#flashcard').classList.remove('flipped');$('#main').textContent='Karte umdrehen'}else if(S.mode!=='examSetup'){$('#question').textContent=q.question;$('#hint').textContent=q.answers.length>1?`${q.answers.length} Antworten auswählen`:'Eine Antwort auswählen';$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option" data-k="${k}"><span class="letter">${k}</span><span class="answer">${esc(v)}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>pick(b.dataset.k,q.answers.length>1));$('#main').textContent='Antwort prüfen';if(S.mode==='exam'&&S.exam)startTimer()}stats()}function pick(k,m){if(locked)return;if(!m)sel.clear();sel.has(k)?sel.delete(k):sel.add(k);document.querySelectorAll('.option').forEach(b=>b.classList.toggle('sel',sel.has(b.dataset.k)))}function grade(reveal=false){if(S.mode==='cards'){if(!$('#flashcard').classList.contains('flipped')){$('#flashcard').classList.add('flipped');$('#main').textContent='Gewusst ✓';return}review(cur(),true);next();return}if(locked){next();return}let q=cur();if(!sel.size&&!reveal)return toast('Bitte Antwort auswählen');let a=[...sel].sort(),z=[...q.answers].sort(),ok=!reveal&&JSON.stringify(a)===JSON.stringify(z);locked=true;document.querySelectorAll('.option').forEach(b=>{let k=b.dataset.k;b.classList.remove('sel');if(z.includes(k))b.classList.add('good');else if(sel.has(k))b.classList.add('bad')});if(!S.done[q.id]&&!reveal){S.done[q.id]=ok?'r':'w';ok?S.r++:S.w++;review(q,ok);save()}let f=$('#feedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<strong>${reveal?'Lösung':ok?'Richtig!':'Noch nicht richtig.'}</strong><div>Antwort: <b>${z.join(', ')}</b></div><div class="why">${esc(q.explanation)}</div>`;$('#main').textContent=S.mode==='exam'?'Nächste Prüfungsfrage':'Nächste Frage';stats()}function next(){if(S.mode==='exam'&&S.pos>=S.order.length-1)return finishExam();S.pos=(S.pos+1)%S.order.length;save();render()}function startTimer(){let end=S.exam.end;function upd(){let left=Math.max(0,end-Date.now()),sec=Math.ceil(left/1000);$('#timer').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(left<=0)finishExam()}upd();tick=setInterval(upd,1000)}function finishExam(){clearInterval(tick);alert(`Prüfung beendet. Aktueller Gesamtstand: ${S.r} richtig, ${S.w} falsch.`);S.exam=null;setMode('learn')}function setMode(m){S.mode=m;S.pos=0;if(m==='learn')S.order=Q.map((_,i)=>i);if(m==='cards'){let ids=dueIds();S.order=(ids.length?ids:Q.map(q=>q.id)).map(id=>Q.findIndex(q=>q.id===id))}if(m==='examSetup')S.order=Q.map((_,i)=>i);save();render()}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode==='exam'?'examSetup':b.dataset.mode));$('#main').onclick=()=>grade();$('#flashcard').onclick=()=>grade();$('#more').onclick=()=>$('#panel').classList.toggle('show');$('#mark').onclick=()=>{let id=cur().id,i=S.b.indexOf(id);i<0?S.b.push(id):S.b.splice(i,1);save();render()};$('#reveal').onclick=()=>grade(true);$('#random').onclick=()=>{shuffle(S.order);S.pos=0;save();render()};$('#wrongOnly').onclick=()=>{let ids=dueIds();if(!ids.length)return toast('Aktuell nichts fällig');S.mode='learn';S.order=ids.map(id=>Q.findIndex(q=>q.id===id));S.pos=0;save();render()};$('#startExam').onclick=()=>{let count=Math.max(1,Math.min(Q.length,+$('#examCount').value||60)),mins=Math.max(1,+$('#examMinutes').value||90);S.mode='exam';S.order=shuffle(Q.map((_,i)=>i)).slice(0,count);S.pos=0;S.exam={end:Date.now()+mins*60000};save();render()};$('#reset').onclick=()=>{if(confirm('Gesamten Fortschritt zurücksetzen?')){localStorage.removeItem(KEY);location.reload()}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));render();
</script></body></html>
