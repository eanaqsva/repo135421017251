<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF Lerntrainer</title><style>
:root{--bg:#f5f7fa;--s:#fff;--s2:#eef2f7;--t:#182033;--m:#667085;--l:#dfe4ea;--p:#2563eb;--ps:#e8f0ff;--ok:#1463d6;--oks:#e7f0ff;--bad:#d92d20;--bads:#fff0ee;--warn:#b54708;--shadow:0 8px 28px #10182812;--safe:env(safe-area-inset-bottom,0px)}[data-theme=dark]{--bg:#111827;--s:#1f2937;--s2:#273449;--t:#f3f4f6;--m:#a7b0bf;--l:#3b4758;--p:#60a5fa;--ps:#1e3a5f;--ok:#67a8ff;--oks:#18385f;--bad:#ff7b72;--bads:#4a2028;--warn:#fdb022;--shadow:0 8px 28px #0005}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}.app{min-height:100dvh}.head{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--s) 95%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--l);padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px}.hr,.back{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850}.icon{width:42px;height:42px;border:1px solid var(--l);border-radius:13px;background:var(--s)}main{max-width:760px;margin:auto;padding:17px 14px 40px}.view{display:none}.view.on{display:block}.hero,.metric,.menu button,.option,.feedback,.panel{background:var(--s);border:1px solid var(--l);box-shadow:var(--shadow)}.hero{border-radius:22px;padding:19px}.hero h1{font-size:1.65rem;margin:6px 0}.hero p,.hint,.counter,.why,.sub{color:var(--m)}.ey{font-size:.78rem;color:var(--p);font-weight:850}.prog{height:10px;background:var(--s2);border-radius:99px;margin:17px 0 8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--p);transition:.3s}.pt{display:flex;justify-content:space-between;color:var(--m);font-size:.88rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.metric{padding:12px 5px;border-radius:16px;text-align:center}.metric b{display:block;font-size:1.28rem}.metric span{font-size:.76rem;color:var(--m)}.menu{display:grid;gap:9px}.menu button,.primary{min-height:52px;border-radius:15px;padding:0 15px;text-align:left}.primary{border:0!important;background:var(--p)!important;color:white;text-align:center!important;font-weight:800}.settings{margin-top:13px;display:grid;gap:8px}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s);border:1px solid var(--l);border-radius:15px;padding:12px 14px}.switch input{width:22px;height:22px}.back{margin-bottom:9px}.back button{border:0;background:none;color:var(--p);padding:8px 0}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--m);font-size:.79rem;margin-bottom:14px}.badgeIcon{font-weight:900;margin-right:3px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.tile{position:relative;aspect-ratio:1;border:1px solid var(--l);border-radius:13px;background:var(--s);font-weight:800}.tile.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}.tile.no{background:var(--bads);border-color:var(--bad);color:var(--bad)}.tile .state{position:absolute;right:4px;top:2px;font-size:.65rem}h2{font-size:clamp(1.2rem,5vw,1.64rem);line-height:1.4}.options{display:grid;gap:10px}.option{min-height:62px;width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;border-radius:16px;padding:13px;transition:.18s}.option:active{transform:scale(.985)}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:var(--s2);color:var(--p);font-weight:850}.answer{padding-top:5px}.option.good{background:var(--oks);border-color:var(--ok);color:var(--ok);animation:pop .35s}.option.bad{background:var(--bads);border-color:var(--bad);color:var(--bad);animation:shake .42s}.option.reveal{background:var(--oks);border-color:var(--ok);color:var(--ok)}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}@keyframes pop{50%{transform:scale(1.025)}}.feedback{display:none;margin-top:13px;padding:14px;border-radius:15px}.feedback.show{display:block}.status{position:fixed;z-index:30;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);opacity:0;border-radius:99px;padding:9px 16px;color:white;font-weight:850;transition:.2s;pointer-events:none}.status.show{opacity:1;transform:translate(-50%,0)}.status.ok{background:var(--ok)}.status.no{background:var(--bad)}.next{width:100%;margin-top:12px}.panel{border-radius:18px;padding:16px;margin-top:12px}.panel h2{margin-top:0}.form{display:grid;gap:11px}.form label{color:var(--m);font-size:.88rem}.form select,.form input{width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid var(--l);background:var(--s2)}.timer{color:var(--warn);font-weight:850}.resultBox{text-align:center}.score{font-size:2.4rem;font-weight:900;color:var(--p)}.goal{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:11px;border-top:1px solid var(--l);font-size:.88rem}.fav{color:var(--warn)}@media(max-width:420px){.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="app"><header class="head"><div class="hr"><div class="brand">VCF Lerntrainer</div><div><span class="timer" id="timer"></span> <button class="icon" id="theme">◐</button></div></div></header><main><section class="view on" id="home"><div class="hero"><div class="ey">DEIN LERNFORTSCHRITT</div><h1>Bereit für die nächste Runde?</h1><p id="copy"></p><div class="prog"><i id="bar"></i></div><div class="pt"><span id="done"></span><b id="pct"></b></div><div class="goal"><span>Tagesziel: <b id="goalDone">0</b> / <b id="goalTarget">10</b></span><span id="goalMark">○</span></div></div><div class="metrics"><div class="metric"><b id="learned">0</b><span>bearbeitet</span></div><div class="metric"><b id="open">60</b><span>offen</span></div><div class="metric"><b id="rate">0%</b><span>richtig</span></div></div><div class="menu"><button class="primary" id="cont">Weiterlernen</button><button id="all">Alle Fragen ansehen</button><button id="examBtn">Prüfungsmodus</button><button id="wrong">Falsche Fragen wiederholen</button><button id="favorites">Gemerkte Fragen</button><button id="statsBtn">Statistik</button></div><div class="settings"><label class="switch"><span>Zufällige Reihenfolge</span><input type="checkbox" id="random"></label><label class="switch"><span>Erklärung nach Antwort anzeigen</span><input type="checkbox" id="explain"></label><label class="switch"><span>Tagesziel</span><select id="goalSelect"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></label><button class="switch" id="reset"><span>Fortschritt zurücksetzen</span><b>↺</b></button></div></section><section class="view" id="overview"><div class="back"><button data-home>‹ Startmenü</button><span class="counter">Alle 60 Fragen</span></div><h1>Fragenübersicht</h1><div class="legend"><span><b class="badgeIcon">○</b> Offen</span><span style="color:var(--ok)"><b class="badgeIcon">✓</b> Richtig</span><span style="color:var(--bad)"><b class="badgeIcon">✕</b> Falsch</span></div><div class="grid" id="grid"></div></section><section class="view" id="quiz"><div class="back"><button data-home>‹ Startmenü</button><span class="counter" id="counter"></span></div><h2 id="question"></h2><p class="hint" id="hint"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="primary next" id="next" style="display:none">Nächste Frage</button></section><section class="view" id="examSetup"><div class="back"><button data-home>‹ Startmenü</button></div><div class="panel"><h2>Prüfungsmodus</h2><div class="form"><label>Anzahl der Fragen<select id="examCount"><option>10</option><option>20</option><option>30</option><option selected>60</option></select></label><label>Zeitlimit<select id="examTime"><option value="15">15 Minuten</option><option value="30">30 Minuten</option><option value="60">60 Minuten</option><option value="90" selected>90 Minuten</option></select></label><button class="primary" id="startExam">Prüfung starten</button></div></div></section><section class="view" id="stats"><div class="back"><button data-home>‹ Startmenü</button></div><div class="panel resultBox"><h2>Statistik</h2><div class="score" id="statRate"></div><p id="statText"></p><div class="metrics"><div class="metric"><b id="statCorrect"></b><span>richtig</span></div><div class="metric"><b id="statWrong"></b><span>falsch</span></div><div class="metric"><b id="statFav"></b><span>gemerkt</span></div></div></div></section><section class="view" id="examResult"><div class="panel resultBox"><h2>Prüfung beendet</h2><div class="score" id="examScore"></div><p id="examVerdict"></p><button class="primary" id="reviewExam">Falsche Prüfungsfragen wiederholen</button><button class="switch next" data-home>Zum Startmenü</button></div></section></main></div><div class="status" id="status"></div><script src="questions.js"></script><script>
const Q=window.VCF_QUESTIONS,K='vcf-complete-v5';let S=JSON.parse(localStorage.getItem(K)||'null')||{pos:0,order:Q.map((_,i)=>i),results:{},theme:'light',explain:false,random:false,favs:[],goal:10,daily:{date:'',count:0},exam:null},locked=false,multiPicked=new Set(),tick=null;const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(S))}function cur(){return Q[S.order[S.pos%S.order.length]]}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function today(){return new Date().toISOString().slice(0,10)}function normalizeDay(){if(S.daily.date!==today())S.daily={date:today(),count:0}}function theme(){document.documentElement.dataset.theme=S.theme==='dark'?'dark':'';save()}function show(id){clearInterval(tick);$('#timer').textContent='';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));if(id==='home')home();if(id==='overview')overview();if(id==='quiz')quiz();if(id==='stats')stats();scrollTo({top:0,behavior:'smooth'})}function sum(){let v=Object.values(S.results),c=v.filter(x=>x==='correct').length,w=v.filter(x=>x==='wrong').length;return{n:v.length,c,w,open:60-v.length,rate:v.length?Math.round(c/v.length*100):0}}function home(){normalizeDay();let x=sum(),p=Math.round(x.n/60*100);$('#copy').textContent=x.n?`Du hast ${x.n} von 60 Fragen bearbeitet.`:'Starte mit der ersten Frage oder öffne die Übersicht.';$('#done').textContent=`${x.n} von 60 bearbeitet`;$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';$('#learned').textContent=x.n;$('#open').textContent=x.open;$('#rate').textContent=x.rate+'%';$('#explain').checked=S.explain;$('#random').checked=S.random;$('#goalSelect').value=String(S.goal);$('#goalDone').textContent=S.daily.count;$('#goalTarget').textContent=S.goal;$('#goalMark').textContent=S.daily.count>=S.goal?'✓':'○';save()}function overview(){$('#grid').innerHTML=Q.map((q,i)=>{let x=S.results[q.id],cl=x==='correct'?'ok':x==='wrong'?'no':'',ic=x==='correct'?'✓':x==='wrong'?'✕':'○';return `<button class="tile ${cl}" data-i="${i}"><span class="state">${ic}</span>${q.id}</button>`}).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{S.exam=null;S.order=Q.map((_,i)=>i);S.pos=+b.dataset.i;save();show('quiz')})}function quiz(){locked=false;multiPicked.clear();let q=cur();$('#counter').textContent=S.exam?`Prüfung ${S.pos+1} / ${S.order.length}`:`Frage ${q.id} von 60`;$('#question').textContent=q.question;$('#hint').textContent=q.answers.length>1?`${q.answers.length} richtige Antworten: Tippe alle richtigen nacheinander an`:'Tippe eine Antwort an';$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option" data-k="${k}"><span class="letter">${k}</span><span class="answer">${esc(v)}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>tap(b.dataset.k));$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#next').style.display='none';if(S.exam)startTimer()}function tap(k){if(locked)return;let q=cur(),multi=q.answers.length>1,b=[...document.querySelectorAll('.option')].find(x=>x.dataset.k===k);if(multi){if(q.answers.includes(k)){b.classList.add('good');multiPicked.add(k);if(multiPicked.size<q.answers.length){flash('Richtig, noch eine','ok');return}finish(true,k)}else{b.classList.add('bad');finish(false,k)}}else finish(q.answers.includes(k),k)}function finish(ok,k){locked=true;normalizeDay();S.daily.count++;let q=cur();S.results[q.id]=ok?'correct':'wrong';if(S.exam){S.exam.answered++;if(ok)S.exam.correct++;else S.exam.wrongIds.push(q.id)}save();document.querySelectorAll('.option').forEach(b=>{if(b.dataset.k===k)b.classList.add(ok?'good':'bad');if(!ok&&q.answers.includes(b.dataset.k))b.classList.add('reveal');b.disabled=true});flash(ok?'✓ Richtig!':'✕ Falsch',ok?'ok':'no');if(S.explain&&!S.exam){let f=$('#feedback');f.className='feedback show';f.innerHTML=`<b>Richtige Antwort${q.answers.length>1?'en':''}: ${q.answers.join(', ')}</b><div class="why">${esc(q.explanation)}</div>`;$('#next').style.display='block'}else setTimeout(next,ok?800:1150)}function flash(t,c){let s=$('#status');s.textContent=t;s.className='status show '+c;setTimeout(()=>s.className='status',700);if(navigator.vibrate)navigator.vibrate(c==='ok'?40:[45,35,45])}function next(){if(S.exam&&S.pos>=S.order.length-1)return finishExam();S.pos=(S.pos+1)%S.order.length;save();quiz();scrollTo({top:0,behavior:'smooth'})}function startTimer(){let end=S.exam.end;function u(){let left=Math.max(0,end-Date.now()),n=Math.ceil(left/1000);$('#timer').textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(left<=0)finishExam()}u();tick=setInterval(u,1000)}function finishExam(){clearInterval(tick);let e=S.exam,p=Math.round(e.correct/e.total*100);S.lastExam={score:p,correct:e.correct,total:e.total,wrongIds:[...new Set(e.wrongIds)]};S.exam=null;save();$('#examScore').textContent=p+'%';$('#examVerdict').textContent=`${e.correct} von ${e.total} richtig. ${p>=70?'Bestanden':'Nicht bestanden'}.`;$('#reviewExam').style.display=S.lastExam.wrongIds.length?'block':'none';show('examResult')}function stats(){let x=sum();$('#statRate').textContent=x.rate+'%';$('#statText').textContent=`${x.n} von 60 Fragen bearbeitet.`;$('#statCorrect').textContent=x.c;$('#statWrong').textContent=x.w;$('#statFav').textContent=S.favs.length}function startList(indices){S.exam=null;S.order=S.random?shuffle([...indices]):[...indices];S.pos=0;save();show('quiz')}$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';theme()};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));$('#all').onclick=()=>show('overview');$('#cont').onclick=()=>{let all=Q.map((_,i)=>i),first=Q.findIndex(q=>!S.results[q.id]);if(S.random)shuffle(all);S.order=all;S.pos=S.random?0:(first<0?0:first);S.exam=null;save();show('quiz')};$('#wrong').onclick=()=>{let x=Q.map((q,i)=>S.results[q.id]==='wrong'?i:-1).filter(i=>i>=0);if(!x.length)return alert('Noch keine falschen Fragen');startList(x)};$('#favorites').onclick=()=>{let x=S.favs.map(id=>Q.findIndex(q=>q.id===id)).filter(i=>i>=0);if(!x.length)return alert('Noch keine Fragen gemerkt');startList(x)};$('#statsBtn').onclick=()=>show('stats');$('#examBtn').onclick=()=>show('examSetup');$('#startExam').onclick=()=>{let n=+$('#examCount').value,m=+$('#examTime').value;S.order=shuffle(Q.map((_,i)=>i)).slice(0,n);S.pos=0;S.exam={total:n,correct:0,answered:0,wrongIds:[],end:Date.now()+m*60000};save();show('quiz')};$('#reviewExam').onclick=()=>startList(S.lastExam.wrongIds.map(id=>Q.findIndex(q=>q.id===id)));$('#random').onchange=e=>{S.random=e.target.checked;save()};$('#explain').onchange=e=>{S.explain=e.target.checked;save()};$('#goalSelect').onchange=e=>{S.goal=+e.target.value;save();home()};$('#next').onclick=next;$('#reset').onclick=()=>{if(confirm('Wirklich den gesamten Lernfortschritt, Statistiken und Markierungen löschen?')){let th=S.theme;localStorage.removeItem(K);S={pos:0,order:Q.map((_,i)=>i),results:{},theme:th,explain:false,random:false,favs:[],goal:10,daily:{date:'',count:0},exam:null};save();show('home')}};document.addEventListener('dblclick',e=>{let o=e.target.closest('.option');if(o&&!locked){let id=cur().id,i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();flash(i<0?'★ Gemerkt':'☆ Entfernt','ok')}});theme();show('home');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
