<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF Lerntrainer</title><style>
:root{--bg:#f4f6f8;--surface:#fff;--surface2:#eef2f7;--text:#172033;--muted:#6b7280;--line:#dfe4ea;--primary:#2563eb;--primary-soft:#e8f0ff;--green:#16a34a;--green-soft:#e9f8ee;--red:#dc2626;--red-soft:#fdecec;--amber:#d97706;--shadow:0 10px 30px rgba(16,24,40,.08);--safe:env(safe-area-inset-bottom,0px)}[data-theme=dark]{--bg:#111827;--surface:#1f2937;--surface2:#273449;--text:#f3f4f6;--muted:#a7b0bf;--line:#374151;--primary:#60a5fa;--primary-soft:#1e3a5f;--green:#4ade80;--green-soft:#173b2a;--red:#fb7185;--red-soft:#4a2028;--amber:#fbbf24;--shadow:0 10px 30px rgba(0,0,0,.24)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{transition:background .2s,color .2s}button{font:inherit;color:inherit}.app{min-height:100dvh;padding-bottom:calc(82px + var(--safe))}.header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 15px 10px}.headerRow{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:760px;margin:auto}.brand{font-weight:800}.iconBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}.content{max-width:760px;margin:auto;padding:18px 14px}.view{display:none}.view.active{display:block}.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.eyebrow{font-size:.82rem;color:var(--primary);font-weight:750}.hero h1{font-size:1.7rem;margin:8px 0}.hero p{margin:0;color:var(--muted)}.progressLine{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:18px 0 8px}.progressLine i{display:block;height:100%;width:0;background:var(--primary);transition:.3s}.progressText{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}.metric b{display:block;font-size:1.35rem}.metric span{color:var(--muted);font-size:.8rem}.menu{display:grid;gap:10px}.menuBtn,.primaryBtn{min-height:54px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:left;padding:0 16px}.primaryBtn{background:var(--primary);color:white;border:0;text-align:center;font-weight:750}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 10px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.questionGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.qTile{aspect-ratio:1;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:750}.qTile.learned{background:var(--green-soft);border-color:var(--green);color:var(--green)}.qTile.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}.qTile.current{outline:3px solid var(--primary)}.backRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.linkBtn{border:0;background:none;color:var(--primary);padding:8px 0}.counter{font-size:.88rem;color:var(--muted)}.question{font-size:clamp(1.2rem,5vw,1.65rem);line-height:1.4;margin:14px 0}.hint{color:var(--muted);font-size:.9rem}.options{display:grid;gap:10px}.option{width:100%;min-height:60px;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px}.option.sel{border-color:var(--primary);background:var(--primary-soft)}.option.good{border-color:var(--green);background:var(--green-soft)}.option.bad{border-color:var(--red);background:var(--red-soft)}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:var(--surface2);color:var(--primary);font-weight:800}.answer{padding-top:5px}.feedback{display:none;margin-top:14px;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}.feedback.show{display:block}.why{margin-top:8px;color:var(--muted);line-height:1.5}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px 12px calc(10px + var(--safe));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:54px 1fr;gap:9px}.bottom button{min-height:52px;border-radius:15px}.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe));transform:translate(-50%,10px);opacity:0;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:420px){.questionGrid{grid-template-columns:repeat(5,1fr)}.cards{gap:7px}.metric{padding:12px 6px}}
</style></head><body><div class="app"><header class="header"><div class="headerRow"><div class="brand">VCF Lerntrainer</div><button class="iconBtn" id="theme" aria-label="Farbschema wechseln">◐</button></div></header><main class="content"><section class="view active" id="home"><div class="hero"><div class="eyebrow">DEIN LERNFORTSCHRITT</div><h1>Bereit für die nächste Runde?</h1><p id="homeCopy"></p><div class="progressLine"><i id="homeBar"></i></div><div class="progressText"><span id="homeDone"></span><strong id="homePercent"></strong></div></div><div class="cards"><div class="metric"><b id="mLearned">0</b><span>gelernt</span></div><div class="metric"><b id="mOpen">60</b><span>offen</span></div><div class="metric"><b id="mRate">0%</b><span>richtig</span></div></div><div class="menu"><button class="primaryBtn" id="continue">Weiterlernen</button><button class="menuBtn" id="openOverview">Alle Fragen ansehen</button><button class="menuBtn" id="wrongMode">Falsche Fragen wiederholen</button></div></section><section class="view" id="overview"><div class="backRow"><button class="linkBtn" data-home>‹ Startmenü</button><span class="counter">Alle 60 Fragen</span></div><h1>Fragenübersicht</h1><div class="legend"><span><i class="dot" style="background:var(--surface);border:1px solid var(--line)"></i>Offen</span><span><i class="dot" style="background:var(--green)"></i>Richtig</span><span><i class="dot" style="background:var(--red)"></i>Falsch</span></div><div class="questionGrid" id="questionGrid"></div></section><section class="view" id="quiz"><div class="backRow"><button class="linkBtn" data-home>‹ Startmenü</button><span class="counter" id="counter"></span></div><h1 class="question" id="question"></h1><div class="hint" id="hint"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div></section></main></div><nav class="bottom" id="bottom" style="display:none"><div class="bottomInner"><button class="iconBtn" id="mark">☆</button><button class="primaryBtn" id="mainAction">Antwort prüfen</button></div></nav><div class="toast" id="toast"></div><script src="questions.js"></script><script>
const Q=window.VCF_QUESTIONS,KEY='vcf-pwa-simple-v3';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{pos:0,order:Q.map((_,i)=>i),results:{},bookmarks:[],theme:'light'},selected=new Set(),locked=false,currentView='home';const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(S))}function cur(){return Q[S.order[S.pos%S.order.length]]}function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t==='dark'?'dark':'';save()}function show(id){currentView=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));$('#bottom').style.display=id==='quiz'?'block':'none';if(id==='home')renderHome();if(id==='overview')renderOverview();if(id==='quiz')renderQuiz();scrollTo({top:0,behavior:'smooth'})}function summary(){let vals=Object.values(S.results),learned=vals.length,correct=vals.filter(x=>x==='correct').length,wrong=vals.filter(x=>x==='wrong').length;return{learned,correct,wrong,open:Q.length-learned,rate:learned?Math.round(correct/learned*100):0}}function renderHome(){let x=summary(),pct=Math.round(x.learned/Q.length*100);$('#homeCopy').textContent=x.learned?`Du hast ${x.learned} von ${Q.length} Fragen bearbeitet.`:'Starte mit der ersten Frage oder öffne die Gesamtübersicht.';$('#homeDone').textContent=`${x.learned} von ${Q.length} bearbeitet`;$('#homePercent').textContent=pct+'%';$('#homeBar').style.width=pct+'%';$('#mLearned').textContent=x.learned;$('#mOpen').textContent=x.open;$('#mRate').textContent=x.rate+'%'}function renderOverview(){let c=cur();$('#questionGrid').innerHTML=Q.map((q,i)=>{let r=S.results[q.id],cl=r==='correct'?'learned':r==='wrong'?'wrong':'';return `<button class="qTile ${cl} ${q.id===c.id?'current':''}" data-i="${i}" aria-label="Frage ${q.id}">${q.id}</button>`}).join('');document.querySelectorAll('.qTile').forEach(b=>b.onclick=()=>{S.order=Q.map((_,i)=>i);S.pos=+b.dataset.i;save();show('quiz')})}function renderQuiz(){selected.clear();locked=false;let q=cur();$('#counter').textContent=`Frage ${q.id} von ${Q.length}`;$('#question').textContent=q.question;$('#hint').textContent=q.answers.length>1?`${q.answers.length} Antworten auswählen`:'Eine Antwort auswählen';$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option" data-k="${k}"><span class="letter">${k}</span><span class="answer">${esc(v)}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>pick(b.dataset.k,q.answers.length>1));$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#mainAction').textContent='Antwort prüfen';$('#mark').textContent=S.bookmarks.includes(q.id)?'★':'☆'}function pick(k,multi){if(locked)return;if(!multi)selected.clear();selected.has(k)?selected.delete(k):selected.add(k);document.querySelectorAll('.option').forEach(b=>b.classList.toggle('sel',selected.has(b.dataset.k)))}function grade(){if(locked)return next();let q=cur();if(!selected.size)return toast('Bitte eine Antwort auswählen');let a=[...selected].sort(),z=[...q.answers].sort(),ok=JSON.stringify(a)===JSON.stringify(z);locked=true;S.results[q.id]=ok?'correct':'wrong';save();document.querySelectorAll('.option').forEach(b=>{let k=b.dataset.k;b.classList.remove('sel');if(z.includes(k))b.classList.add('good');else if(selected.has(k))b.classList.add('bad')});let f=$('#feedback');f.className='feedback show';f.innerHTML=`<strong>${ok?'Richtig!':'Noch nicht richtig.'}</strong><div>Richtige Antwort${z.length>1?'en':''}: <b>${z.join(', ')}</b></div><div class="why">${esc(q.explanation)}</div>`;$('#mainAction').textContent='Nächste Frage'}function next(){S.pos=(S.pos+1)%S.order.length;save();renderQuiz();scrollTo({top:0,behavior:'smooth'})}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}$('#theme').onclick=()=>setTheme(S.theme==='dark'?'light':'dark');document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));$('#openOverview').onclick=()=>show('overview');$('#continue').onclick=()=>{S.order=Q.map((_,i)=>i);let first=Q.findIndex(q=>!S.results[q.id]);S.pos=first<0?0:first;save();show('quiz')};$('#wrongMode').onclick=()=>{let ids=Q.filter(q=>S.results[q.id]==='wrong');if(!ids.length)return toast('Noch keine falschen Fragen');S.order=ids.map(q=>Q.findIndex(x=>x.id===q.id));S.pos=0;save();show('quiz')};$('#mainAction').onclick=grade;$('#mark').onclick=()=>{let id=cur().id,i=S.bookmarks.indexOf(id);i<0?S.bookmarks.push(id):S.bookmarks.splice(i,1);save();renderQuiz()};setTheme(S.theme||'light');show('home');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
